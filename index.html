/* Layout: barra superior con pestañas; en pantallas anchas el formulario queda a la izquierda y la hoja del documento a la derecha, fija mientras se edita. */
:root{
  --bg:#F5EDE4; --surface:#FFFBF6; --ink:#2A2018; --muted:#7B6B5D; --line:#E2D4C4;
  --gold:#7C5620; --gold-soft:#EFE1D0; --on-gold:#FFFBF6; --danger:#A33A2A; --ok:#2F6B45;
  --f-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-body:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* hoja del documento: siempre papel blanco, sin importar el tema */
  --paper:#FFFFFF; --p-ink:#2A2018; --p-muted:#7B6B5D; --p-line:#E4D8CB; --p-gold:#8A5F22; --p-soft:#F8F1E8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1612; --surface:#251F19; --ink:#F2E8DB; --muted:#A99A8B; --line:#3A3027; --gold:#D4AA66; --gold-soft:#33291E; --on-gold:#1B1612; --danger:#E27C6A; --ok:#6FC08C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1612; --surface:#251F19; --ink:#F2E8DB; --muted:#A99A8B; --line:#3A3027; --gold:#D4AA66; --gold-soft:#33291E; --on-gold:#1B1612; --danger:#E27C6A; --ok:#6FC08C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body)}
.wrap{max-width:1260px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font:600 28px/1 var(--f-display);letter-spacing:.02em;margin:0}
.brand span{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;border-radius:999px;padding:9px 16px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--gold);color:var(--on-gold)}

.work{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:18px}
@media(min-width:1000px){.work{grid-template-columns:minmax(0,430px) minmax(0,1fr);align-items:start}.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font:600 22px/1.1 var(--f-display);margin:0}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1 1 130px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px 11px;min-height:44px}
textarea{min-height:80px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:11px 6px;font-weight:500;color:var(--muted);min-height:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.btn{background:var(--gold);color:var(--on-gold);border:0;border-radius:8px;padding:12px 18px;font-weight:600;min-height:46px}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.x{background:none;border:0;color:var(--danger);font-size:22px;line-height:1;min-width:40px;min-height:40px}
.hint{font-size:13px;color:var(--muted)}
.msg{font-size:14px;min-height:20px}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}

.line{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.line .row>.field{flex:1 1 70px}
.line input{background:var(--surface)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow select{flex:1 1 220px}
.sum{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .big{font:600 24px/1.2 var(--f-display);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}

table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table.t th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;font-weight:500;white-space:nowrap}
table.t td{padding:6px;border-top:1px solid var(--line);vertical-align:middle}
table.t td input{min-height:40px}
.catrow td{background:var(--gold-soft);font-weight:600;color:var(--gold);padding:7px 8px}
.banner{background:var(--gold-soft);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.hist{display:flex;flex-direction:column;gap:0}
.hitem{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.hitem:first-child{border-top:0}
.hitem b{font-family:var(--f-display);font-size:19px}
.hmeta{min-width:0;flex:1 1 220px}
.pill{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:2px 9px;margin-left:6px;font-weight:600}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font:600 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}

.logos{display:flex;gap:12px;flex-wrap:wrap}
.logopick{flex:1 1 150px;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.logopick[aria-pressed="true"]{border-color:var(--gold)}
.logopick img{height:90px;max-width:100%;object-fit:contain;background:#fff;border-radius:6px;padding:4px}

/* ---------- hoja del documento ---------- */
.scale{overflow:hidden;border-radius:6px;border:1px solid var(--line)}
.paper{width:760px;min-height:1000px;background:var(--paper);color:var(--p-ink);padding:44px 48px 36px;font:400 13.5px/1.45 var(--f-body);display:flex;flex-direction:column}
.paper *{color:inherit}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.p-logo{height:96px;width:auto;max-width:300px;object-fit:contain}
.p-prof{text-align:right;font-size:12px;line-height:1.5;color:var(--p-muted)}
.p-prof strong{display:block;font:600 21px/1.15 var(--f-display);color:var(--p-ink);margin-bottom:3px}
.p-title{margin-top:30px;text-align:center;border-top:1px solid var(--p-line);border-bottom:1px solid var(--p-line);padding:16px 0}
.p-kind{font:600 32px/1.1 var(--f-display);letter-spacing:.02em}
.p-num{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--p-gold);margin-top:5px;font-weight:600}
.p-sub{margin-top:4px;font-size:14px;color:var(--p-muted)}
.p-h{font:600 18px/1 var(--f-display);color:var(--p-gold);margin:24px 0 8px;letter-spacing:.03em}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:13px}
.p-grid b{font-weight:600;margin-right:5px}
.p-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.p-table th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--p-muted);text-align:left;padding:7px 6px;border-top:1.5px solid var(--p-ink);border-bottom:1px solid var(--p-ink);font-weight:600}
.p-table td{padding:8px 6px;border-bottom:1px solid var(--p-line);vertical-align:top}
.p-table .r{text-align:right;white-space:nowrap}
.p-tot{margin-left:auto;width:290px;margin-top:12px;font-variant-numeric:tabular-nums}
.p-tot div{display:flex;justify-content:space-between;padding:3px 6px}
.p-tot .grand{font:600 20px/1.2 var(--f-display);border-top:1.5px solid var(--p-ink);margin-top:4px;padding-top:7px}
.p-tot .saldo{background:var(--p-soft);font-weight:600;margin-top:4px;padding:6px}
.p-note{margin-top:14px;font-size:12.5px;color:var(--p-muted);white-space:pre-wrap}
.p-sign{display:flex;gap:50px;margin-top:auto;padding-top:56px}
.p-sign div{flex:1;border-top:1px solid var(--p-ink);padding-top:5px;font-size:11.5px;color:var(--p-muted);text-align:center}
.p-foot{margin-top:22px;padding-top:10px;border-top:1px solid var(--p-line);font-size:10.5px;color:var(--p-muted);line-height:1.5}
.ph{color:var(--p-muted);font-style:italic}

/* ---------- ventana de imagen ---------- */
.modal{position:fixed;inset:0;background:rgba(20,14,9,.78);z-index:20;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);overflow:auto}
.modal img{max-width:min(100%,760px);height:auto;background:#fff;border-radius:6px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.modal .tip{background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 14px;max-width:560px;text-align:center}
</style>

<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><h1>Nova Dental</h1><span>Recibo de pago</span></div>
  </div>

  <section class="work">
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="card">
        <h2>Paciente</h2>
        <div class="field"><label class="lbl" for="pName">Nombre completo</label><input id="pName" autocomplete="off" placeholder="Nombre y apellidos"></div>
        <div class="row">
          <div class="field" style="flex:0 0 90px"><label class="lbl" for="pIdType">Tipo</label>
            <select id="pIdType"><option>CC</option><option>TI</option><option>CE</option><option>PA</option><option>RC</option></select></div>
          <div class="field" style="flex:1 1 150px"><label class="lbl" for="pId">Identificación</label><input id="pId" inputmode="numeric" autocomplete="off"></div>
          <div class="field" style="flex:1 1 150px"><label class="lbl" for="pPhone">Celular (opcional)</label><input id="pPhone" inputmode="tel" autocomplete="off"></div>
        </div>
      </div>

      <div class="card">
        <h2>Prestaciones</h2>
        <div class="addrow">
          <select id="addSel" aria-label="Elegir prestación"></select>
          <button class="btn small" id="addBtn">Agregar</button>
          <button class="btn small ghost" id="addFree">Línea libre</button>
        </div>
        <p class="hint">Los valores de la lista son de ejemplo. Edítalos en cada línea hasta cargar tus tarifas.</p>
        <div id="lines" style="display:flex;flex-direction:column;gap:10px"></div>
        <div class="sum" id="sumBox"></div>
      </div>

      <div class="card">
        <h2>Pago</h2>
        <div class="row">
          <div class="field"><label class="lbl" for="abono">Valor recibido</label><input id="abono" inputmode="numeric" autocomplete="off"></div>
          <div class="field"><label class="lbl" for="method">Forma de pago</label>
            <select id="method"><option>Efectivo</option><option>Transferencia</option><option>Nequi</option><option>Daviplata</option><option>Tarjeta débito</option><option>Tarjeta crédito</option></select></div>
          <div class="field"><label class="lbl" for="date">Fecha</label><input type="date" id="date"></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" id="genBtn">Crear imagen del recibo</button>
          <button class="btn ghost" id="newBtn">Recibo nuevo</button>
        </div>
        <div class="msg" id="msg" role="status"></div>
      </div>

      <details class="card" id="mine">
        <summary style="cursor:pointer;font:600 22px/1.1 var(--f-display)">Mis datos</summary>
        <p class="hint">Aparecen en el encabezado. Los campos vacíos no se muestran.</p>
        <div class="field"><label class="lbl" for="f_nombre">Nombre</label><input id="f_nombre" data-p="nombre"></div>
        <div class="row">
          <div class="field"><label class="lbl" for="f_cc">Cédula</label><input id="f_cc" data-p="cc" inputmode="numeric"></div>
          <div class="field"><label class="lbl" for="f_rethus">Registro RETHUS</label><input id="f_rethus" data-p="rethus"></div>
        </div>
        <div class="row">
          <div class="field"><label class="lbl" for="f_nit">NIT o RUT</label><input id="f_nit" data-p="nit"></div>
          <div class="field"><label class="lbl" for="f_tel">Celular</label><input id="f_tel" data-p="tel" inputmode="tel"></div>
        </div>
        <div class="field"><label class="lbl" for="f_lugar">Lugar de atención</label><input id="f_lugar" data-p="lugar"></div>
        <div class="field"><label class="lbl" for="f_ig">Instagram</label><input id="f_ig" data-p="ig" placeholder="@usuario"></div>

const LS='novadental.recibo.v1';
const CAT=[
 ['Consulta y prevención',[['Consulta de valoración y diagnóstico',80000],['Profilaxis (limpieza dental)',120000],['Aplicación de flúor',60000]]],
 ['Periodoncia',[['Detartraje supragingival',150000],['Raspado y alisado radicular (por cuadrante)',250000],['Mantenimiento periodontal',180000],['Gingivectomía / gingivoplastia (por sextante)',350000],['Alargamiento de corona clínica (por pieza)',450000],['Injerto gingival (por pieza)',900000]]],
 ['Restauración y estética',[['Resina de una superficie',120000],['Resina de dos superficies',160000],['Blanqueamiento dental (por arcada)',450000],['Placa de relajación (NMR)',600000]]],
 ['Cirugía',[['Exodoncia simple',150000]]]
];
const DEFP={nombre:'Stephanie Julieth Castañeda Sánchez',titulo:'Odontóloga Periodoncista',cc:'',rethus:'',nit:'',tel:'',ig:'',lugar:'Consultorio Nova Dental · Tueme, Bogotá',logo:'steph',
  nota:'Este documento es un soporte de la atención prestada y no reemplaza la factura electrónica de venta cuando esta sea exigible.'};
let S={profile:Object.assign({},DEFP),seq:1};
try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(r){S.profile=Object.assign({},DEFP,r.profile||{});S.seq=r.seq||1}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const num=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const longDate=iso=>{const p=(iso||today()).split('-').map(Number);return p[2]+' de '+MES[p[1]-1]+' de '+p[0]};
const pad=n=>'REC-'+String(n).padStart(4,'0');

function newDoc(){return {date:today(),pName:'',pIdType:'CC',pId:'',pPhone:'',method:'Efectivo',lines:[{name:CAT[0][1][1][0],piece:'',qty:1,price:CAT[0][1][1][1],disc:0}],abono:0,auto:true,saved:false}}
let D=newDoc();

function totals(d){let sub=0,tot=0;d.lines.forEach(l=>{const g=l.qty*l.price;sub+=g;tot+=g*(1-(l.disc||0)/100)});tot=Math.round(tot);sub=Math.round(sub);
  const ab=d.auto?tot:Math.min(d.abono||0,tot);return {sub,dcto:sub-tot,tot,abono:ab,saldo:tot-ab}}

function paperHTML(d){
  const p=S.profile,t=totals(d);
  const showPiece=d.lines.some(l=>l.piece),showDisc=d.lines.some(l=>l.disc>0);
  const prof=[];
  if(p.titulo)prof.push(esc(p.titulo));
  if(p.cc)prof.push('CC '+esc(p.cc));
  if(p.rethus)prof.push('Registro '+esc(p.rethus));
  if(p.nit)prof.push('NIT/RUT '+esc(p.nit));
  if(p.tel)prof.push('Cel. '+esc(p.tel));
  if(p.lugar)prof.push(esc(p.lugar));
  if(p.ig)prof.push(esc(p.ig));
  const pat=(v,ph)=>v?esc(v):'<span class="ph">'+ph+'</span>';
  const rows=d.lines.length?d.lines.map(l=>{const tot=Math.round(l.qty*l.price*(1-(l.disc||0)/100));
    return '<tr><td>'+esc(l.name||'—')+'</td>'+(showPiece?'<td>'+esc(l.piece)+'</td>':'')+'<td class="r">'+l.qty+'</td><td class="r">'+money(l.price)+'</td>'+(showDisc?'<td class="r">'+(l.disc||0)+'%</td>':'')+'<td class="r"><b>'+money(tot)+'</b></td></tr>'}).join('')
    :'<tr><td colspan="5" class="ph">Agrega las prestaciones del recibo.</td></tr>';
  let tot='<div><span>Subtotal</span><span>'+money(t.sub)+'</span></div>';
  if(t.dcto>0)tot+='<div><span>Descuento</span><span>− '+money(t.dcto)+'</span></div>';
  tot+='<div class="grand"><span>Total</span><span>'+money(t.tot)+'</span></div>';
  tot+='<div><span>Valor recibido ('+esc(d.method)+')</span><span>'+money(t.abono)+'</span></div>';
  tot+='<div class="saldo"><span>'+(t.saldo===0?'Pagado en su totalidad':'Saldo pendiente')+'</span><span>'+(t.saldo===0?'':money(t.saldo))+'</span></div>';
  return '<div class="paper">'
   +'<div class="p-head"><img class="p-logo" alt="" src="'+LOGO[p.logo||'steph']+'"><div class="p-prof"><strong>Dra. '+esc(p.nombre)+'</strong>'+prof.join('<br>')+'</div></div>'
   +'<div class="p-title"><div class="p-kind">Recibo de pago</div><div class="p-num">N.º '+pad(S.seq)+' · '+longDate(d.date)+'</div></div>'
   +'<div class="p-h">Recibí de</div><div class="p-grid"><div><b>Nombre</b>'+pat(d.pName,'Nombre del paciente')+'</div><div><b>'+esc(d.pIdType)+'</b>'+pat(d.pId,'Identificación')+'</div>'+(d.pPhone?'<div><b>Celular</b>'+esc(d.pPhone)+'</div>':'')+'</div>'
   +'<div class="p-h">Por concepto de</div><table class="p-table"><thead><tr><th>Prestación</th>'+(showPiece?'<th>Pieza(s)</th>':'')+'<th class="r">Cant.</th><th class="r">Valor</th>'+(showDisc?'<th class="r">Dcto.</th>':'')+'<th class="r">Total</th></tr></thead><tbody>'+rows+'</tbody></table>'
   +'<div class="p-tot">'+tot+'</div>'
   +'<div class="p-sign"><div>Firma de la profesional</div></div>'
   +(p.nota?'<div class="p-foot">'+esc(p.nota)+'</div>':'')
   +'</div>';
}
function fitPaper(){const w=$('scale').clientWidth;$('paperHost').style.zoom=Math.min(1,(w-2)/760)}
function renderPaper(){$('paperHost').innerHTML=paperHTML(D);fitPaper()}
function renderSum(){const t=totals(D);let h='<div><span>Subtotal</span><span>'+money(t.sub)+'</span></div>';
  if(t.dcto>0)h+='<div><span>Descuento</span><span>− '+money(t.dcto)+'</span></div>';
  h+='<div class="big"><span>Total</span><span>'+money(t.tot)+'</span></div>';
  if(!D.auto)h+='<div><span>Saldo pendiente</span><span>'+money(t.saldo)+'</span></div>';
  $('sumBox').innerHTML=h;
  if(D.auto&&document.activeElement!==$('abono'))$('abono').value=money(t.tot)}
function renderLines(){
  $('lines').innerHTML=D.lines.map((l,i)=>
   '<div class="line" data-i="'+i+'"><div style="display:flex;gap:6px;align-items:center"><input data-f="name" value="'+esc(l.name)+'" aria-label="Prestación" placeholder="Descripción"><button class="x" data-del="'+i+'" aria-label="Quitar prestación">×</button></div>'
   +'<div class="row"><div class="field"><span class="lbl">Pieza(s)</span><input data-f="piece" value="'+esc(l.piece)+'" placeholder="11, 21" aria-label="Piezas"></div>'
   +'<div class="field"><span class="lbl">Cant.</span><input data-f="qty" inputmode="numeric" value="'+l.qty+'" aria-label="Cantidad"></div>'
   +'<div class="field" style="flex:2 1 110px"><span class="lbl">Valor</span><input data-f="price" inputmode="numeric" value="'+money(l.price)+'" aria-label="Valor"></div>'
   +'<div class="field"><span class="lbl">Dcto. %</span><input data-f="disc" inputmode="numeric" value="'+(l.disc||0)+'" aria-label="Descuento"></div></div></div>'
  ).join('')||'<p class="hint">Aún no hay prestaciones. Elige una de la lista y toca Agregar.</p>';
}
function refresh(){renderSum();renderPaper()}
function say(t,c){const m=$('msg');m.textContent=t;m.className='msg '+(c||'')}
function fillForm(){
  $('pName').value=D.pName;$('pIdType').value=D.pIdType;$('pId').value=D.pId;$('pPhone').value=D.pPhone;$('method').value=D.method;$('date').value=D.date;
  $('abono').value='';renderLines();renderSum();renderPaper();
}

let h='';CAT.forEach(c=>{h+='<optgroup label="'+esc(c[0])+'">'+c[1].map((x,i)=>'<option value="'+esc(x[0])+'|'+x[1]+'">'+esc(x[0])+' — '+money(x[1])+'</option>').join('')+'</optgroup>'});$('addSel').innerHTML=h;

[['pName','pName'],['pIdType','pIdType'],['pId','pId'],['pPhone','pPhone'],['method','method'],['date','date']].forEach(a=>{const el=$(a[0]);const f=()=>{D[a[1]]=el.value;refresh()};el.addEventListener('input',f);el.addEventListener('change',f)});
$('abono').addEventListener('input',e=>{D.auto=false;D.abono=num(e.target.value);refresh()});
$('abono').addEventListener('blur',()=>{if(!D.auto)$('abono').value=D.abono?money(D.abono):'';renderSum()});
$('addBtn').addEventListener('click',()=>{const v=$('addSel').value.split('|');D.lines.push({name:v[0],piece:'',qty:1,price:+v[1],disc:0});renderLines();refresh()});
$('addFree').addEventListener('click',()=>{D.lines.push({name:'',piece:'',qty:1,price:0,disc:0});renderLines();refresh();const r=$('lines').querySelectorAll('.line');if(r.length)r[r.length-1].querySelector('input').focus()});
$('lines').addEventListener('input',e=>{const el=e.target,row=el.closest('.line');if(!row||!el.dataset.f)return;const l=D.lines[+row.dataset.i],f=el.dataset.f;
  if(f==='name'||f==='piece')l[f]=el.value;else if(f==='qty')l.qty=Math.max(1,num(el.value));else if(f==='price')l.price=num(el.value);else if(f==='disc')l.disc=Math.min(100,num(el.value));refresh()});
$('lines').addEventListener('focusout',e=>{const el=e.target;if(el.dataset&&el.dataset.f==='price')el.value=money(D.lines[+el.closest('.line').dataset.i].price)});
$('lines').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;D.lines.splice(+b.dataset.del,1);renderLines();refresh()});
$('newBtn').addEventListener('click',()=>{D=newDoc();fillForm();say('')});

$('genBtn').addEventListener('click',async()=>{
  if(!D.pName.trim()){say('Escribe el nombre del paciente.','err');$('pName').focus();return}
  if(!D.lines.length){say('Agrega al menos una prestación.','err');return}
  if(typeof html2canvas!=='function'){say('No se pudo cargar el generador de imágenes. Revisa la conexión e inténtalo de nuevo.','err');return}
  say('Creando imagen…');
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0;width:760px';host.innerHTML=paperHTML(D);document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const cv=await html2canvas(host.firstChild,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
    $('outImg').src=cv.toDataURL('image/png');$('modal').hidden=false;
    say('Listo: '+pad(S.seq)+'. El formulario quedó limpio para el siguiente paciente.','ok');
    S.seq++;save();D.saved=true;
    D=Object.assign(newDoc(),{});fillForm();
  }catch(err){say('La imagen falló. Inténtalo de nuevo.','err')}
  finally{host.remove()}
});
$('modalClose').addEventListener('click',()=>{$('modal').hidden=true});

document.querySelectorAll('[data-p]').forEach(el=>{el.value=S.profile[el.dataset.p]||'';el.addEventListener('input',()=>{S.profile[el.dataset.p]=el.value;save();renderPaper()})});
function logoState(){document.querySelectorAll('.logopick').forEach(b=>b.setAttribute('aria-pressed',b.dataset.logo===S.profile.logo))}
document.querySelectorAll('.logopick').forEach(b=>b.addEventListener('click',()=>{S.profile.logo=b.dataset.logo;save();logoState();renderPaper()}));
logoState();
window.addEventListener('resize',fitPaper);
if(window.ResizeObserver)new ResizeObserver(fitPaper).observe($('scale'));
fillForm();
})();
</script>
